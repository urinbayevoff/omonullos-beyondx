# Galaxy S10 5G speakers (snd-zrn-abox-bx): ACP makes no sink for this card
# (no front:0, and pro-audio did not come up either), so pipewire.conf.d/
# 51-zrn-speakers.conf opens hw:0,0 itself; keep ACP off the card.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.platform-snd-zrn-abox-bx" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
