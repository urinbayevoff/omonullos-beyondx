# Galaxy S10 5G (OmonullOS): a phone should power off in seconds. Units (and
# systemd-shutdown's last SIGTERM round, which gets the same timeout) wait at
# most 15 s, not 90, so the shutdown ends well inside the watchdog's last
# reload (zboot-guards.service). Added October 2026.
[Manager]
DefaultTimeoutStopSec=15s
