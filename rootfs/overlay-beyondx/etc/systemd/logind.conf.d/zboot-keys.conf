# Galaxy S10 5G (OmonullOS): a short press of the power key turns the screen
# off and on in ztMETRO; holding it (logind's long press, ~5 s) powers the
# phone off (the kernel drops PS_HOLD: DT syscon-poweroff). The owner asked for a way out
# when it ran hot and would not turn off (2026-10-18).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
