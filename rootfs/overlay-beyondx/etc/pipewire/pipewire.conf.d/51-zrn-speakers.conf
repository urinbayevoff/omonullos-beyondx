# Galaxy S10 5G speakers: a sink straight on hw:0,0 (16 bit, 2 ch, 48 kHz is
# what snd-zrn-abox-bx takes; 40 ms periods: the DSP moves one per period of its own 40 ms ring)
context.objects = [
  { factory = adapter
    args = {
      factory.name = api.alsa.pcm.sink
      node.name = "zrn-speakers"
      node.description = "Karnay"
      media.class = "Audio/Sink"
      api.alsa.path = "hw:0,0"
      audio.format = "S16LE"
      audio.rate = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
      api.alsa.period-size = 1920
      # the graph in steps of the card's period, or it xruns (2048 vs 1920)
      node.force-quantum = 1920
      node.latency = 1920/48000
      priority.session = 2000
      priority.driver = 2000
    }
    flags = [ nofail ]
  }
]
