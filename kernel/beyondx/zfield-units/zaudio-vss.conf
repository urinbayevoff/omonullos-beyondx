[Service]
ExecStart=
ExecStart=/root/tools/zaudio-vss.sh
# a clean shutdown or reboot with the VSS on is not a hang: drop the mark, so
# a reboot within two minutes does not leave the next boots on the stand-in
# (a hang never gets here; a stand-in boot keeps its mark)
ExecStop=/bin/sh -c 'grep -qx 1 /sys/module/snd_zrn_abox_bx/parameters/vss_cp 2>/dev/null && rm -f /var/lib/zaudio/vss-try; sync'
